  corp: Viveris, en mission chez un opérateur international de télécommunications
  description: |
    Plateforme de gestion de machines virtuelles sécurisées.
    - API backend *(FastAPI, PostgreSQL)* : Développement de nouvelles fonctionnalités, refonte de l'authentification et de la gestion des utilisateurs, couverture de tests complète.
    - Image de VM durcie *(Packer, Debian)* : mise en conformité CIS Benchmark (SSH, élévation de privilèges), corrections issues d'un pentest, chaîne de validation automatique avec Goss et Lynis.
