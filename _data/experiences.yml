    - Refonte de l'authentification JWT, couverture de tests complète, évolutions fonctionnelles et nouvelle charte graphique.
    - Conteneurisation et déploiement sur Kubernetes *(Kustomize, ArgoCD)*.

    CI/CD et infra : pipelines Jenkins, Docker, Rancher, SonarQube.
