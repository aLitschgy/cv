<h2><i class="uil uil-code-branch"></i>Compétences techniques</h2>
<hr />
<div class="technical-skills">
  {% for category in site.data.languages %}
  <section class="skill-category">
    <h3>{{ category.name }}</h3>
    <ul class="language-list">
      {% for item in category.items %}
      <li>
        {% if item.logo-name %}
        <i class="devicon-{{ item.logo-name }} colored"></i>
        {% endif %} {% if item.logo-name2 %}
        <i class="devicon-{{ item.logo-name2 }} colored"></i>
        {% endif %} {{ item.name }}
      </li>
      {% endfor %}
    </ul>
  </section>
  {% endfor %}
</div>
